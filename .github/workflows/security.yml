name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan repository for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo:ro"
          zricethezav/gitleaks:v8.24.3
          detect --source=/repo --config=/repo/.gitleaks.toml --no-git --no-banner --redact --exit-code 1

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build backend runtime image
        run: docker build --target runtime --tag park-plaza-api:security Backend
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: park-plaza-api:security
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
