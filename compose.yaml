services:
  postgres:
    image: postgres:17-bookworm
    env_file: Backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  setup:
    build:
      context: Backend
      target: runtime
    env_file: Backend/.env
    volumes:
      - ./menu_park_plaza.md:/menu_park_plaza.md:ro
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        node dist/src/database/migrate.js
        node dist/src/auth/bootstrap-admin.js
        node dist/src/database/provision-room-inventory.js "$$BOOTSTRAP_PROPERTY_CODE"
    restart: "no"

  api:
    build:
      context: Backend
      target: runtime
    env_file: Backend/.env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_SSL: "false"
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped


